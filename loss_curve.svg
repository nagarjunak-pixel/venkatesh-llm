<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style>
    rect.bg { fill: #0f172a; rx: 12px; }
    text { font-family: "Inter", system-ui, -apple-system, sans-serif; }
    .title { fill: #f8fafc; font-size: 20px; font-weight: 700; text-anchor: middle; }
    .axis-label { fill: #94a3b8; font-size: 13px; font-weight: 500; }
    .tick-text { fill: #64748b; font-size: 11px; }
    .grid-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 4,4; opacity: 0.6; }
    .axis-line { stroke: #475569; stroke-width: 1.5; }
    .line-train { stroke: #38bdf8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .line-val { stroke: #fb923c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .area-train { fill: url(#train-gradient); opacity: 0.15; }
    .area-val { fill: url(#val-gradient); opacity: 0.1; }
    .legend-text { fill: #e2e8f0; font-size: 12px; font-weight: 500; }
    .tooltip-dot { stroke-width: 2; }
    .tooltip-dot-train { fill: #0f172a; stroke: #38bdf8; }
    .tooltip-dot-val { fill: #0f172a; stroke: #fb923c; }
  </style>
  <defs>
    <linearGradient id="train-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="val-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect class="bg" width="800" height="500" />
